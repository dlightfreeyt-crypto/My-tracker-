<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827"><meta name="description" content="Your private offline daily target tracker">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png">
<title>MY DAY – Daily Target Tracker</title>
<style>
:root{color-scheme:dark;--bg:#101827;--panel:#1e293b;--muted:#a7b4c8;--cyan:#67d5e8;--green:#4ade80}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:16px system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
main{max-width:560px;margin:auto;padding:22px 0 36px}.top{display:flex;justify-content:space-between;align-items:center}.top h1{font-size:26px;margin:0;letter-spacing:.5px}.sub,.muted{color:var(--muted);font-size:12px;letter-spacing:1px}.target{color:var(--cyan);font-size:12px;margin:22px 0 10px}
.card{background:var(--panel);border-radius:18px;padding:17px;margin-bottom:18px}.small{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:1px}.percent{font-size:32px;color:var(--cyan);font-weight:800;margin:7px 0}
.track{height:9px;background:#334155;border-radius:20px;overflow:hidden}.fill{height:100%;background:var(--cyan);width:0%;transition:width .2s}
h2{font-size:17px;margin:22px 0 11px}.task{background:var(--panel);padding:13px 10px;border-radius:12px;display:flex;align-items:center;gap:10px;margin:8px 0}.task.done{background:#164e45}.task input{width:21px;height:21px;accent-color:var(--green);flex-shrink:0}.task span{flex:1;overflow-wrap:anywhere}.task.done span{text-decoration:line-through;color:#86efac}.del{border:0;background:transparent;color:#fca5a5;font-size:19px;padding:4px 8px}
input[type=text]{width:100%;padding:14px;border:1px solid #475569;border-radius:12px;background:#1e293b;color:white;font-size:16px;margin:5px 0 9px}
button,.filebtn{border:0;border-radius:12px;background:#26364e;color:#fff;padding:13px 14px;font-weight:700;font-size:14px;cursor:pointer}.primary{background:#0e7490;width:100%}.actions{display:flex;gap:9px;margin-top:12px}.actions button{flex:1}.history{margin-top:14px}.history div{padding:10px 0;border-bottom:1px solid #334155;color:var(--muted);font-size:14px}.footer{text-align:center;color:#94a3b8;font-size:10px;letter-spacing:1px;margin:25px 0 0}
</style></head>
<body><main>
<header class="top"><div><h1>MY DAY</h1><div class="sub">BUILD YOUR BEST VERSION.</div></div><div style="font-size:30px">🎯</div></header>
<div class="target" id="date"></div>
<section class="card"><div class="small">TODAY'S PROGRESS</div><div class="percent" id="percent">0% <span style="font-size:14px;color:white;font-weight:500">0/0 completed</span></div><div class="track"><div class="fill" id="fill"></div></div><div class="muted" id="message" style="margin-top:10px">One task at a time. You've got this!</div></section>
<h2>MY CHECKLIST</h2><section id="tasks"></section>
<form id="addForm"><input id="newTask" type="text" maxlength="100" placeholder="Add your own target..." autocomplete="off"><button class="primary" type="submit">＋ ADD TARGET</button></form>
<div class="actions"><button id="historyBtn">PROGRESS HISTORY</button><button id="resetBtn">RESET TODAY</button></div>
<section class="history" id="history" hidden><h2>PREVIOUS DAYS</h2><div id="historyList"></div></section>
<p class="footer">DISCIPLINE • CONSISTENCY • GROWTH</p>
</main>
<script>
const defaults=["Wake up on time 🌅","Make my bed","Drink enough water 💧","Exercise for 20 minutes","Study for 2 hours 📚","Learn a new skill 💻","Read for 15 minutes","Avoid unnecessary scrolling 📵","Track my expenses 💰","Plan tomorrow 🌙"];
const $=id=>document.getElementById(id);
const key=d=>"myday-"+d;
const dateKey=()=>{let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
let date=dateKey(), data;
function load(){try{data=JSON.parse(localStorage.getItem(key(date)))}catch(e){} if(!data)data={tasks:date===dateKey()?defaults.slice():[],done:[]};}
function save(){localStorage.setItem(key(date),JSON.stringify(data));}
function render(){
$("date").textContent="TODAY  •  "+date;
let count=data.done.length,total=data.tasks.length,pct=total?Math.round(count/total*100):0;
$("percent").innerHTML=pct+'% <span style="font-size:14px;color:white;font-weight:500">'+count+'/'+total+' completed</span>';
$("fill").style.width=pct+"%";$("message").textContent=pct===100&&total?"All targets completed. You're unstoppable! 🔥":pct>=50?"Great progress. Keep going!":"One task at a time. You've got this!";
$("tasks").replaceChildren();
data.tasks.forEach((t,i)=>{let row=document.createElement("label");row.className="task"+(data.done.includes(i)?" done":"");
let cb=document.createElement("input");cb.type="checkbox";cb.checked=data.done.includes(i);cb.addEventListener("change",()=>{data.done=cb.checked?[...data.done,i]:data.done.filter(x=>x!==i);save();render();});
let span=document.createElement("span");span.textContent=t;
let del=document.createElement("button");del.type="button";del.className="del";del.textContent="×";del.setAttribute("aria-label","Delete target");del.addEventListener("click",()=>{if(!confirm("Delete this target?"))return;data.tasks.splice(i,1);data.done=data.done.filter(x=>x!==i).map(x=>x>i?x-1:x);save();render();});
row.append(cb,span,del);$("tasks").append(row);});
}
$("addForm").addEventListener("submit",e=>{e.preventDefault();let v=$("newTask").value.trim();if(!v)return;data.tasks.push(v);$("newTask").value="";save();render();});
$("resetBtn").addEventListener("click",()=>{if(confirm("Reset today's completed targets?")){data.done=[];save();render();}});
$("historyBtn").addEventListener("click",()=>{let box=$("history");box.hidden=!box.hidden;if(!box.hidden)showHistory();});
function showHistory(){let keys=Object.keys(localStorage).filter(k=>k.startsWith("myday-")).sort().reverse();let list=$("historyList");list.replaceChildren();if(!keys.length){list.textContent="No history yet.";return;}keys.forEach(k=>{try{let d=JSON.parse(localStorage.getItem(k)),n=d.tasks.length,c=d.done.length,p=n?Math.round(c/n*100):0;let row=document.createElement("div");row.textContent=k.slice(6)+" — "+p+"% ("+c+"/"+n+")";list.append(row)}catch(e){}})}
load();render();
if("serviceWorker" in navigator && location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
